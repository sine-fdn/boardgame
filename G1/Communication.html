{% extends "global/Page.html" %} {% block content %}
<style>
  .otree-chat__btn-send {
    background-color: #4080ff;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 25px;
    padding: 5px 20px;
    font-weight: bold;
    max-width: 100px;
    margin-top: 10px;
  }

  .otree-chat__btn-send:hover {
    background-color: #3060cc;
  }

  .otree-chat__btn-send::-moz-focus-inner {
    border: 0;
  }

  .otree-chat__input {
    padding: 5px 15px;
    border-radius: 25px;
    border: 1px solid #ccc;
    font-size: 16px;
    width: 100%;
    margin-top: 10px
  }

  .otree-chat__messages {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background-color: #f9f9f9;
    width: 100%;
  }

  .otree-chat {
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .otree-chat__form,
  .otree-chat form {
    display: flex !important;
    gap: 10px;
    align-items: stretch;
    width: 100%;
  }
</style>
<h2 class="text-center mt-5">Chat</h2>
<p class="mt-4">
  You now have the chance to communicate with each other. The game will
  automatically proceed when your time is up. You are not allowed to communicate
  anymore after the time is up.
</p>
{{ chat }} {% endblock %}
