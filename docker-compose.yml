services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otree:
    image: ${IMAGE:-ghcr.io/sine-fdn/boardgame}:${IMAGE_TAG:-latest}
    ports:
      - "${OTREE_BIND_ADDR:-0.0.0.0}:${OTREE_HOST_PORT:-8000}:8000"
    environment:
      - OTREE_ADMIN_USERNAME
      - OTREE_ADMIN_PASSWORD=${OTREE_ADMIN_PASSWORD:?OTREE_ADMIN_PASSWORD is not set (see .env.example)}
      - OTREE_SECRET_KEY=${OTREE_SECRET_KEY:?OTREE_SECRET_KEY is not set (see .env.example)}
      - OTREE_REST_KEY=${OTREE_REST_KEY:?OTREE_REST_KEY is not set (see .env.example)}
      - DATABASE_URL
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
