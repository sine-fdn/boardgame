  <rect x="8" y="8" width="48" height="48" rx="8" ry="8" fill="#E8F6F3" stroke="#444" stroke-width="1.8"/>
  <!-- pole -->
  <line x1="20" y1="18" x2="20" y2="46" stroke="#117A65" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sign -->
  <circle cx="20" cy="16" r="4" fill="none" stroke="#117A65" stroke-width="2"/>
  <!-- canopy / shade line -->
  <path d="M20 24h24c4 0 6 2 6 4h-30" fill="none" stroke="#16A085" stroke-width="2" stroke-linejoin="round"/>
  <!-- bench -->
  <rect x="24" y="34" width="18" height="3" fill="#117A65" opacity=".9"/>
  <rect x="26" y="37" width="2" height="6" fill="#117A65"/>
  <rect x="38" y="37" width="2" height="6" fill="#117A65"/>
  <!-- ground shade -->
